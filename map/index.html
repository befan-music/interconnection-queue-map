<title>Interconnection Headroom Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed map; a control rail floats on the left, an inspector slides in on the right;
   both become bottom sheets on phones. Neutrals are cool slate; copper is the single accent. */
:root {
  --bg: #e9eef0; --land: #f7f8f7; --state: #c9d1d5; --panel: #ffffff; --panel-2: #f2f5f6;
  --ink: #16202a; --muted: #5a6772; --rule: #d6dde1;
  --accent: #b05d27; --accent-ink: #ffffff;
  --line-lo: #a3afb7; --line-mid: #6b7a86; --line-hi: #24313c;
  --good: #16905c; --warn: #c98f00; --bad: #cc3a3a; --na: #a9b2b8; --store: #6a4cc0;
  --ba: #7f8c96; --blm: #d9a441;
  --shadow: 0 1px 2px rgb(16 24 32 / .08), 0 8px 24px rgb(16 24 32 / .10);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1217; --land: #141c23; --state: #2a3640; --panel: #121a21; --panel-2: #18222a;
  --ink: #e5ebee; --muted: #93a0aa; --rule: #26323c;
  --accent: #e0894d; --accent-ink: #1a0f08;
  --line-lo: #3f4c57; --line-mid: #7d8b96; --line-hi: #d2dbe0;
  --good: #35c486; --warn: #f0b62a; --bad: #ff6a6a; --na: #4c5862; --store: #a68cff;
  --ba: #7b8892; --blm: #d9a441;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c1217; --land: #141c23; --state: #2a3640; --panel: #121a21; --panel-2: #18222a;
  --ink: #e5ebee; --muted: #93a0aa; --rule: #26323c;
  --accent: #e0894d; --accent-ink: #1a0f08;
  --line-lo: #3f4c57; --line-mid: #7d8b96; --line-hi: #d2dbe0;
  --good: #35c486; --warn: #f0b62a; --bad: #ff6a6a; --na: #4c5862; --store: #a68cff;
  --ba: #7b8892; --blm: #d9a441;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .35); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); overflow: hidden; }
#map { position: absolute; inset: 0; }
.maplibregl-map { overflow: hidden; position: relative; -webkit-tap-highlight-color: transparent; }
.maplibregl-canvas { position: absolute; left: 0; top: 0; }
.maplibregl-canvas-container.maplibregl-interactive { cursor: grab; }
.maplibregl-canvas-container.maplibregl-interactive:active { cursor: grabbing; }
.maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-top-left, .maplibregl-ctrl-top-right { display: none; }

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---- rail ---- */
.rail {
  position: absolute; z-index: 5; display: flex; flex-direction: column;
  top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px));
  bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 340px;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow);
  overflow: hidden;
}
.rail-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--rule); display: grid; gap: 4px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 { margin: 0; font: 700 23px/1 var(--f-display); letter-spacing: .01em; text-wrap: balance; }
.brand h1 span { color: var(--accent); }
.sub { margin: 0; color: var(--muted); font-size: 12.5px; }
.rail-toggle { display: none; border: 1px solid var(--rule); background: var(--panel-2); border-radius: 6px; padding: 2px 8px; font-size: 12px; }
.rail-body { overflow-y: auto; padding: 12px 16px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-content: start; }
.rail-body > * { min-width: 0; }
.brand .title { display: flex; align-items: center; gap: 8px; min-width: 0; }
.eyebrow-row { display: flex; align-items: center; gap: 6px; }

/* ---- info buttons: every explanation lives behind an "i" ---- */
.info { display: inline-grid; place-items: center; width: 18px; height: 18px; flex: none; padding: 0; border-radius: 50%;
  border: 1px solid var(--rule); background: var(--panel-2); color: var(--muted); font: italic 600 11px/1 Georgia, serif; vertical-align: middle; }
.info:hover, .info[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.pop { position: fixed; z-index: 60; width: max-content; max-width: min(320px, calc(100vw - 16px)); padding: 10px 12px; display: grid; gap: 6px;
  background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow);
  font: 400 12.5px/1.45 var(--f-body); text-align: left; letter-spacing: 0; text-transform: none; }
.pop p { margin: 0; }
.pop ul { margin: 0; padding-left: 16px; display: grid; gap: 2px; }

.lens { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.lens button {
  text-align: left; border: 1px solid var(--rule); background: var(--panel-2); border-radius: 8px;
  padding: 8px 10px; display: grid; gap: 1px;
}
.lens button b { font: 600 16px/1.1 var(--f-display); letter-spacing: .01em; }
.lens button small { color: var(--muted); font-size: 11.5px; line-height: 1.3; }
.lens button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); box-shadow: inset 0 0 0 1px var(--accent); }

.tally { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tally div { border-radius: 8px; padding: 8px 10px; background: var(--panel-2); display: grid; gap: 2px; }
.tally .v { font: 600 18px/1 var(--f-mono); }
.tally .k { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

.legend { display: grid; gap: 6px; font-size: 12.5px; }
.legend .row { display: flex; align-items: center; gap: 8px; }
.legend .ramp { height: 8px; border-radius: 4px; flex: 1; }

fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 7px; }
legend { padding: 0; margin-bottom: 4px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.check input { accent-color: var(--accent); margin: 0; }
.check em { font-style: normal; color: var(--muted); font-size: 12px; margin-left: auto; }
.ctl-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ctl-row label, .search label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
select, input[type="search"], input[type="number"] {
  border: 1px solid var(--rule); background: var(--panel-2); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0;
}
.search { position: relative; }
.results { list-style: none; margin: 4px 0 0; padding: 0; border: 1px solid var(--rule); border-radius: 6px; max-height: 220px; overflow-y: auto; background: var(--panel); }
.results li button { width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; display: flex; justify-content: space-between; gap: 8px; }
.results li button:hover { background: var(--panel-2); }
.results small { color: var(--muted); }

.sites { display: grid; gap: 4px; }
.sites-head { display: flex; justify-content: space-between; align-items: baseline; }
.site { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 8px; border: 0; background: none; padding: 5px 4px; border-radius: 6px; text-align: left; }
.site:hover { background: var(--panel-2); }
.site span:nth-child(2) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.site small { color: var(--muted); }
.site .num { font-size: 12.5px; }
.empty { color: var(--muted); font-size: 12.5px; margin: 0; }

.rail-foot { border-top: 1px solid var(--rule); padding: 10px 16px; display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 600; font-size: 12.5px; }

/* ---- zoom ---- */
.zoom { position: absolute; z-index: 4; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); background: var(--panel); }
.zoom button { width: 34px; height: 34px; border: 0; background: var(--panel); font: 500 18px/1 var(--f-mono); }
.zoom button + button { border-top: 1px solid var(--rule); }
.attrib { position: absolute; z-index: 3; right: 58px; bottom: calc(6px + env(safe-area-inset-bottom, 0px)); font-size: 10.5px; color: var(--muted); background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 1px 6px; border-radius: 4px; }

/* ---- tooltip ---- */
.tip { position: absolute; z-index: 6; pointer-events: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; box-shadow: var(--shadow); font-size: 12px; max-width: 260px; }
.tip b { font-weight: 600; }

/* ---- inspector ---- */
.inspector {
  position: absolute; z-index: 5; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(70px + env(safe-area-inset-bottom, 0px)); width: 380px; background: var(--panel);
  border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden;
}
.insp-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--rule); display: grid; gap: 6px; position: relative; }
.insp-head h2 { margin: 0; font: 700 24px/1.05 var(--f-display); padding-right: 32px; text-wrap: balance; overflow-wrap: anywhere; }
.insp-head .meta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel-2); font-size: 16px; line-height: 1; }
.insp-body { overflow-y: auto; padding: 14px 16px 18px; display: grid; gap: 18px; align-content: start; }
.verdict { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; padding: 12px; border-radius: 8px; background: var(--panel-2); border-left: 4px solid var(--sig, var(--na)); }
.verdict .big { font: 600 30px/1 var(--f-mono); grid-row: span 2; }
.verdict .big small { font-size: 14px; color: var(--muted); }
.verdict .lab { font-weight: 600; }
.verdict .exp { font-size: 12px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 600; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 5px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.sec { display: grid; gap: 8px; }
.sec h3 { margin: 0; }
.bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--panel-2); }
.bar span { height: 100%; }
.bar-key { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--muted); }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; max-height: 260px; overflow-y: auto; border: 1px solid var(--rule); border-radius: 6px; }
.plist li { padding: 6px 8px; display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; font-size: 12.5px; background: var(--panel); }
.plist li + li { border-top: 1px solid var(--rule); }
.plist .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.plist .d { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; }
.constraint { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; background: none; text-align: left; }
.constraint:hover { border-color: var(--accent); }
.constraint b { font-weight: 600; }
.constraint small { color: var(--muted); }
.note { font-size: 11.5px; color: var(--muted); margin: 0; }

/* ---- method dialog ---- */
dialog { border: 1px solid var(--rule); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: var(--shadow); }
dialog::backdrop { background: rgb(10 16 22 / .45); }
.dlg { padding: 22px 26px 26px; display: grid; gap: 14px; overflow-y: auto; max-height: calc(100vh - 50px); }
.dlg h2 { margin: 0; font: 700 28px/1.05 var(--f-display); }
.dlg h3 { margin: 6px 0 0; font: 600 18px/1.2 var(--f-display); letter-spacing: .01em; }
.dlg p, .dlg li { max-width: 68ch; }
.dlg p { margin: 0; }
.dlg ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
td a { color: var(--accent); overflow-wrap: anywhere; }

.foot-links { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.project { display: grid; grid-template-columns: 1fr; gap: 6px; }
.project label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.lens button.wide { grid-column: 1 / -1; }
.weights summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 12.5px; }
.weights .w { display: grid; grid-template-columns: 74px 1fr 40px; gap: 8px; align-items: center; margin-top: 6px; font-size: 12.5px; }
.weights input[type="range"] { accent-color: var(--accent); width: 100%; min-width: 0; }
.tally.five { gap: 4px; }
.tally.five div { padding: 6px 5px; }
.tally.five .v { font-size: 14px; }
.tally.five .k { font-size: 10.5px; gap: 3px; }
.grade { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 8px; font: 700 24px/1 var(--f-display); color: var(--panel); background: var(--c); }
.risk-card { display: grid; gap: 12px; padding: 12px; border-radius: 8px; background: var(--panel-2); border-left: 4px solid var(--c); }
.risk-top { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; }
.risk-top .lab { font-weight: 600; }
.risk-top .exp { font-size: 12px; color: var(--muted); }
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.metric { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 8px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.metric .v { font: 600 17px/1.15 var(--f-mono); }
.metric .k { font-size: 11px; color: var(--muted); }
.metric .r { font-size: 11px; color: var(--muted); font-family: var(--f-mono); overflow-wrap: anywhere; }
.upg { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 12.5px; }
.upg li { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; }
.upg li small { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; }
@media (max-width: 420px) { .metrics { grid-template-columns: 1fr 1fr; } }
.claims-list { display: grid; gap: 8px; }
details.claim { border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); }
details.claim[open] { border-color: var(--accent); }
details.claim summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: baseline; padding: 10px 12px; }
details.claim summary::-webkit-details-marker { display: none; }
details.claim summary:hover { background: var(--panel-2); border-radius: 8px; }
.cid { font: 600 12px/1 var(--f-mono); color: var(--accent); }
.ctitle { font-weight: 600; min-width: 0; }
.cval { font: 500 12.5px/1.3 var(--f-mono); color: var(--muted); text-align: right; }
.cbody { padding: 2px 12px 14px; display: grid; gap: 10px; min-width: 0; }
.cbody h4 { margin: 4px 0 0; font: 600 11px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cbody ol, .cbody ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.cbody .pill { justify-self: start; }
@media (max-width: 560px) { details.claim summary { grid-template-columns: auto 1fr; } .cval { grid-column: 1 / -1; text-align: left; } }
/* ---- project risk score ---- */
.cta { border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: 600 16px/1 var(--f-display); letter-spacing: .02em; padding: 10px 12px; }
#score { width: min(1000px, calc(100vw - 32px)); }
.sc-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sc-head h2 { margin: 0; font: 700 28px/1.05 var(--f-display); }
.sc-actions { display: flex; align-items: center; gap: 14px; }
.sc { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; }
.sc-form { display: grid; gap: 12px; min-width: 0; }
.sc-form input, .sc-form select { box-sizing: border-box; }
.f2 label { min-width: 0; }
#score .plist li { max-width: none; }
.sc-poi { display: grid; gap: 6px; }
.sc-poi small { color: var(--muted); }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.f2 label, .segf > span { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.segf { display: grid; gap: 4px; }
.seg { display: flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--panel-2); padding: 6px 4px; font-size: 12px; line-height: 1.2; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.sc-out { display: grid; gap: 16px; align-content: start; min-width: 0; }
.sc-top { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; padding: 14px; border-radius: 8px; background: var(--panel-2); border-left: 4px solid var(--c); }
.sc-p { font: 600 52px/1 var(--f-mono); color: var(--c); }
.sc-p small { font-size: 22px; }
.sc-top .lab { font-weight: 600; font-size: 15px; }
.sc-top .exp { font-size: 12.5px; color: var(--muted); }
.drivers { display: grid; gap: 6px; }
.drv { display: grid; grid-template-columns: minmax(0, 1fr) 110px 36px; gap: 10px; align-items: center; font-size: 12.5px; }
.drv small { color: var(--muted); }
.drv .axis { position: relative; height: 8px; border-radius: 4px; background: var(--panel-2); }
.drv .axis::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.drv .axis span { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.drv .num { text-align: right; }
.print-only { display: none; }
@media (max-width: 760px) { .sc { grid-template-columns: 1fr; } }
.loading { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--bg); }
.loading div { display: grid; gap: 6px; justify-items: center; color: var(--muted); }
.loading b { font: 700 26px/1 var(--f-display); color: var(--ink); }

@media (max-width: 760px) {
  .rail { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 62%; border-radius: 12px 12px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .rail.collapsed .rail-body, .rail.collapsed .rail-foot { display: none; }
  .rail-head { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .rail-toggle { display: inline-block; }
  .inspector { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 70%; border-radius: 12px 12px 0 0; z-index: 7; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .zoom { top: calc(12px + env(safe-area-inset-top, 0px)); bottom: auto; }
  .attrib { top: calc(12px + env(safe-area-inset-top, 0px)); bottom: auto; right: auto; left: max(12px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
@media print {
  :root:not(#_print) {
    --bg: #ffffff; --panel: #ffffff; --panel-2: #f2f5f6; --ink: #16202a; --muted: #5a6772; --rule: #d6dde1;
    --accent: #b05d27; --accent-ink: #ffffff; --good: #16905c; --warn: #c98f00; --bad: #cc3a3a; color-scheme: light; }

<script>
(() => {
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v, d = 0) => (v == null || Number.isNaN(v)) ? "–" : Number(v).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
const mw = (v) => v == null ? "–" : (v >= 2999 ? "3,000+" : fmt(v));
const tok = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

let D = {}; let map; let lens = "risk"; let selected = null;
const SIG_NAME = ["Headroom", "Limited", "Congested", "Not modeled"];
const TECH_COLORS = { "Solar": "#e3b505", "Wind": "#2a9d8f", "Offshore wind": "#1b6f8a", "Battery": "#8a63d2", "Gas CC": "#6c7a89", "Gas CT/other": "#9aa5b1", "Coal": "#5b4636", "Nuclear": "#c2417b", "Hydro": "#3a7bd5", "Pumped storage": "#3a7bd5", "Oil": "#7a5c3c", "Geothermal": "#c0672f", "Biomass/other": "#7f9a52" };
const PHASES = [["qC", "Construction", "--line-hi"], ["qI", "IA executed", "--accent"], ["qL", "Late study", "--line-mid"], ["qE", "Early study", "--line-lo"]];

function decode(str) {
  let i = 0, lat = 0, lon = 0; const out = [];
  while (i < str.length) {
    let b, s = 0, r = 0;
    do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << s; s += 5; } while (b >= 32);
    lat += (r & 1) ? ~(r >> 1) : (r >> 1);
    s = 0; r = 0;
    do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << s; s += 5; } while (b >= 32);
    lon += (r & 1) ? ~(r >> 1) : (r >> 1);
    out.push([lon / 1e4, lat / 1e4]);
  }

}
const lineGeom = (parts) => parts.length === 1 ? { type: "LineString", coordinates: decode(parts[0]) } : { type: "MultiLineString", coordinates: parts.map(decode) };
function polyGeom(parts) {

}

async function load() {
  const names = ["meta", "buses", "lines", "queue", "plants", "context", "claims", "risk"];
  const res = await Promise.all(names.map((n) => fetch(`data/${n}.json`).then((r) => { if (!r.ok) throw new Error(n); return r.json(); })));
  names.forEach((n, i) => D[n] = res[i]);
  const B = D.buses, Q = D.queue, P = D.plants, L = D.lines;
  B.n = B.id.length; L.n = L.id.length;
  B.idx = new Map(B.id.map((id, i) => [id, i]));
  L.idx = new Map(L.id.map((id, i) => [id, i]));
  B.proj = new Map(); Q.node.forEach((nd, i) => { if (!B.proj.has(nd)) B.proj.set(nd, []); B.proj.get(nd).push(i); });
  B.plants = new Map(); P.node.forEach((nd, i) => { if (!B.plants.has(nd)) B.plants.set(nd, []); B.plants.get(nd).push(i); });
  const m = D.risk.meta.miso;
  B.poiM = B.kv.map((kv) => { let k = 0, best = Infinity; m.kv.forEach((v, j) => { const d = Math.abs(Math.log(v / Math.max(kv || 115, 60))); if (d < best) { best = d; k = j; } }); return m.add_position_baah_musd[k]; });
}

// ---------------- risk ----------------
const GRADES = ["A", "B", "C", "D", "E"];
const GRADE_CUTS = [25, 40, 55, 70];
const CONF = ["Low", "Medium", "High"];
const sizeIdx = () => +$("#psize").value;
function weights() {
  const c = +$("#wCost").value, t = +$("#wTime").value, f = +$("#wFit").value, s = c + t + f || 1;
  return { cost: c / s, time: t / s, fit: f / s };
}
function riskOf(i, s = sizeIdx(), W = weights()) {
  const R = D.risk; if (!R.net[i]) return null;
  const P = R.sizes[s], poi = D.buses.poiM[i] * 1e6 / (P * 1e3), net = R.net[i][s];
  const cost = poi + net, yrs = R.yr[i][s], fit = R.fit[i][s] / 100;
  const sc = (x, [lo, hi]) => Math.min(1, Math.max(0, (hi - x) / (hi - lo)));
  const risk = 100 * (1 - (W.cost * sc(cost, R.meta.cost_anchor) + W.time * sc(yrs, R.meta.time_anchor) + W.fit * fit));
  const grade = GRADE_CUTS.findIndex((c) => risk < c);
  return { P, poi, net, cost, yrs, fit, risk, grade: grade < 0 ? 4 : grade };
}
function computeRisk() {
  const B = D.buses, s = sizeIdx(), W = weights();
  D.rk = { grade: new Int8Array(B.n).fill(5), risk: new Float32Array(B.n).fill(NaN) };
  for (let i = 0; i < B.n; i++) { const r = riskOf(i, s, W); if (r) { D.rk.grade[i] = r.grade; D.rk.risk[i] = r.risk; } }
}
function hexMix(a, b, t) {
  const p = (h) => h.replace("#", "").match(/../g).map((x) => parseInt(x, 16));
  const [x, y] = [p(a), p(b)];
  return "#" + x.map((v, k) => Math.round(v + (y[k] - v) * t).toString(16).padStart(2, "0")).join("");
}
const gradeColors = () => { const g = tok("--good"), w = tok("--warn"), r = tok("--bad"); return [g, hexMix(g, w, 0.5), w, hexMix(w, r, 0.5), r]; };

function qcat(i) { const B = D.buses; if (!B.q[i]) return 3; const r = B.qcap[i]; if (r == null) return 2; return r < 0.5 ? 0 : (r <= 1.5 ? 1 : 2); }

function busFC() {
  const B = D.buses, f = [];
  for (let i = 0; i < B.n; i++) {
    f.push({ type: "Feature", id: i, geometry: { type: "Point", coordinates: [B.lon[i], B.lat[i]] },
      properties: { i, kv: B.kv[i] || 0, t: B.type[i], sig: B.sig[i], lsig: B.lsig[i], qc: qcat(i), sto: B.sto[i], stoS: B.stoS[i] || 0, q: B.q[i] || 0, mod: B.mod[i], rg: D.rk.grade[i] } });

}
function lineFC() {
  const L = D.lines, f = [];

}

}
const polyFC = (o, props = () => ({})) => ({ type: "FeatureCollection", features: o.g.map((g, i) => ({ type: "Feature", geometry: polyGeom(g), properties: props(i) })) });

// ---------------- styling ----------------
function busColor() {
  const g = tok("--good"), w = tok("--warn"), r = tok("--bad"), na = tok("--na"), st = tok("--store");
  if (lens === "risk") { const c = gradeColors(); return ["match", ["get", "rg"], 0, c[0], 1, c[1], 2, c[2], 3, c[3], 4, c[4], na]; }
  if (lens === "gen") return ["match", ["get", "sig"], 0, g, 1, w, 2, r, na];
  if (lens === "load") return ["match", ["get", "lsig"], 0, g, 1, w, 2, r, na];
  if (lens === "queue") return ["match", ["get", "qc"], 0, g, 1, w, 2, r, na];
  return ["case", ["==", ["get", "sto"], 1], st, na];
}
function busRadius() {
  const base = (z) => ["case", [">=", ["get", "kv"], 500], 1.8 * z, [">=", ["get", "kv"], 345], 1.5 * z, [">=", ["get", "kv"], 230], 1.2 * z, 0.9 * z];
  if (lens === "storage") return ["interpolate", ["linear"], ["zoom"], 3, ["case", ["==", ["get", "sto"], 1], ["min", 6, ["+", 2, ["*", 0.3, ["sqrt", ["get", "stoS"]]]]], 1], 9, ["case", ["==", ["get", "sto"], 1], ["min", 14, ["+", 5, ["sqrt", ["get", "stoS"]]]], 3]];
  return ["interpolate", ["linear"], ["zoom"], 3, base(1.6), 6, base(3), 9, base(5), 12, base(7)];
}
function lineColor() {
  const mode = $("#linecolor").value;
  if (mode === "kv") return ["interpolate", ["linear"], ["get", "kv"], 100, tok("--line-lo"), 230, tok("--line-mid"), 500, tok("--line-hi")];
  const key = mode === "load" ? "ld" : "lq";
  return ["case", ["<", ["get", key], 0], tok("--line-lo"), ["interpolate", ["linear"], ["get", key], 0, tok("--line-lo"), 60, tok("--good"), 85, tok("--warn"), 100, tok("--bad")]];
}

}
function minKvFilter() {

}

function addLayers() {

  map.addSource("sel", { type: "geojson", data: { type: "FeatureCollection", features: [] } });

  map.addLayer({ id: "land", type: "fill", source: "states", paint: { "fill-color": tok("--land") } });

  map.addLayer({ id: "state-line", type: "line", source: "states", paint: { "line-color": tok("--state"), "line-width": 0.8 } });
  map.addLayer({ id: "ba", type: "line", source: "ba", layout: { visibility: "none" }, paint: { "line-color": tok("--ba"), "line-width": 1.1, "line-dasharray": [3, 2] } });

      "line-width": ["interpolate", ["linear"], ["zoom"], 3, ["interpolate", ["linear"], ["get", "kv"], 100, 0.25, 345, 0.8, 765, 1.6], 8, ["interpolate", ["linear"], ["get", "kv"], 100, 0.8, 345, 2, 765, 3.5], 12, ["interpolate", ["linear"], ["get", "kv"], 100, 2, 345, 4, 765, 6]] } });
  map.addLayer({ id: "hl-casing", type: "line", source: "hl", layout: { "line-cap": "round" }, paint: { "line-color": tok("--panel"), "line-width": 9 } });
  map.addLayer({ id: "hl", type: "line", source: "hl", layout: { "line-cap": "round" }, paint: { "line-color": tok("--accent"), "line-width": 4.5 } });

      "circle-radius": ["interpolate", ["linear"], ["zoom"], 3, ["min", 5, ["*", 0.12, ["sqrt", ["get", "mw"]]]], 9, ["min", 16, ["*", 0.45, ["sqrt", ["get", "mw"]]]]],
      "circle-opacity": 0.75, "circle-stroke-width": 0.5, "circle-stroke-color": tok("--panel") } });
  map.addLayer({ id: "queue", type: "circle", source: "buses", layout: { visibility: "none" }, filter: [">", ["get", "q"], 0],
    paint: { "circle-color": tok("--accent"), "circle-opacity": 0.14, "circle-stroke-color": tok("--accent"), "circle-stroke-width": 1.2,
      "circle-radius": ["interpolate", ["linear"], ["zoom"], 3, ["*", 0.11, ["sqrt", ["get", "q"]]], 9, ["*", 0.5, ["sqrt", ["get", "q"]]]] } });
  map.addLayer({ id: "buses", type: "circle", source: "buses", filter: minKvFilter(),

    paint: { "circle-color": busColor(), "circle-radius": busRadius(), "circle-stroke-color": tok("--panel"), "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 4, 0, 7, 0.8] } });
  map.addLayer({ id: "sel", type: "circle", source: "sel", paint: { "circle-radius": 11, "circle-color": "rgba(0,0,0,0)", "circle-stroke-color": tok("--accent"), "circle-stroke-width": 2.5 } });
}

function restyle() {

// ---------------- rail ----------------
const LENS = {

    legend: [["A", "Low risk", "risk index under 25"], ["B", "", "25–40"], ["C", "", "40–55"], ["D", "", "55–70"], ["E", "High risk", "70 or more"]] },
  gen: { key: "sig", title: "Best sites in view", note: "≥115 kV, most MW after queue", metric: "hGq",

  load: { key: "lsig", title: "Best sites for large load", note: "≥115 kV, most MW at peak", metric: "hLq",
    legend: [["--good", "Headroom", "≥ 250 MW withdrawable at summer peak"], ["--warn", "Limited", "75–250 MW"], ["--bad", "Constrained", "< 75 MW"], ["--na", "Not modeled", "Island in the line data"]] },
  queue: { key: "qc", title: "Most crowded substations", note: "queued MW ÷ N-1 branch capacity", metric: "qcap",
    legend: [["--good", "Room", "Queue < 0.5× substation capacity"], ["--warn", "Crowded", "0.5–1.5×"], ["--bad", "Oversubscribed", "> 1.5× (red in the original scoring rule)"], ["--na", "No active queue", ""]] },
  storage: { key: "sto", title: "Storage & reconductoring candidates", note: "renewables per MW of headroom", metric: "stoS",

function renderTally() {

    $("#tally").innerHTML = n.map((v, g) => `<div><span class="v">${fmt(v)}</span><span class="k"><i class="dot" style="background:${col[g]}"></i>Grade ${GRADES[g]}</span></div>`).join("");

function renderSites() {
  if (!map) return;
  if (lens === "risk") return renderRiskSites();
  const B = D.buses, b = map.getBounds(), cfg = LENS[lens], m = B[cfg.metric]; const cand = [];
  for (let i = 0; i < B.n; i++) {
    const lon = B.lon[i], lat = B.lat[i];
    if (lon < b.getWest() || lon > b.getEast() || lat < b.getSouth() || lat > b.getNorth()) continue;
    if ((B.kv[i] || 0) < Math.max(115, +$("#minkv").value) || !B.mod[i] || B.type[i] !== 0) continue;
    if (lens === "queue" && !B.q[i]) continue;

    const val = lens === "queue" ? `${fmt(m[i], 1)}×` : lens === "storage" ? fmt(m[i], 1) : `${mw(m[i])} MW`;
    return `<button class="site" data-bus="${i}"><i class="dot" style="background:var(${color})"></i><span>${esc(B.name[i])} <small>${esc(B.kvl[i])} kV · ${esc(B.st[i] || "")}</small></span><span class="num">${val}</span></button>`;

}

function renderRiskSites() {
  const B = D.buses, b = map.getBounds(), col = gradeColors(), cand = [];
  for (let i = 0; i < B.n; i++) {
    const lon = B.lon[i], lat = B.lat[i];

    if ((B.kv[i] || 0) < Math.max(115, +$("#minkv").value) || B.type[i] !== 0 || !(D.rk.grade[i] < 5)) continue;

function upgradeExposure(i, P) {
  // lines our model says a P MW project here would overload, priced with MISO MTEP24 unit costs
  const R = D.risk, L = D.lines, m = R.meta.miso, con = R.con[i] || [];
  const unit = (kv, tab) => { let k = 0, best = Infinity; m.kv.forEach((v, j) => { const d = Math.abs(Math.log(v / Math.max(kv, 60))); if (d < best) { best = d; k = j; } }); return tab[k]; };
  const items = [];
  for (const [lid, margin, dfp] of con) {
    if (margin >= P) continue;
    const j = L.idx.get(lid); if (j == null) continue;
    const df = Math.abs(dfp) / 100, U = 0.85 * L.lim[j], extra = df * (P - margin), miles = L.len[j] / 1.609;
    const recon = L.basis[j] === 0 && extra <= U;
    const musd = miles * unit(L.kv[j], recon ? m.reconductor_musd_per_mile : m.new_line_musd_per_mile);
    const overQ = Math.max(0, ((L.ldQ[j] ?? 0) / 100 - 1) * U);
    const share = (df * P) / (df * P + overQ);
    items.push({ j, recon, musd, share, df, extra });
  }
  return { items, more: con.length >= 5 && con.every((c) => c[1] < P) };
}

function riskCard(i) {
  const B = D.buses, R = D.risk, r = riskOf(i);
  if (!r) return "";
  const reg = R.regions[R.rg[i]], meta = R.meta, P = r.P, col = gradeColors()[r.grade];
  const dur = (meta.durations[reg] && meta.durations[reg].to_cod) || meta.durations.national.to_cod;
  const ia = (meta.durations[reg] && meta.durations[reg].to_ia) || meta.durations.national.to_ia;
  const [q25, q75] = meta.residual_iqr;
  const comp = meta.completion[reg] || meta.completion.national;
  const q = R.q[i], h = R.h[i];
  let html = `<div class="risk-card" style="--c:${col}">
    <div class="risk-top"><span class="grade" style="--c:${col}">${GRADES[r.grade]}</span>
      <div><div class="lab">Risk index ${fmt(r.risk)} / 100 for a ${fmt(P)} MW project</div>
      <div class="exp">${esc(reg)} · confidence ${CONF[R.cf[i]]} <button class="info" data-info="riskcard" data-i="${i}" aria-label="How the risk index is built">i</button></div></div></div>
    <div class="metrics">
      <div class="metric"><span class="k">Expected cost</span><span class="v">$${fmt(r.cost)}/kW</span><span class="r">$${fmt(r.poi + r.net * q25)}–${fmt(r.poi + r.net * q75)}/kW · ≈$${fmt(r.cost * P / 1000, 1)}M</span></div>
      <div class="metric"><span class="k">Time to operation</span><span class="v">${fmt(r.yrs, 1)} yrs</span><span class="r">${fmt(r.yrs * dur.p25 / dur.p50, 1)}–${fmt(r.yrs * dur.p75 / dur.p50, 1)} yrs · agreement ~${fmt(ia.p50, 1)} yrs</span></div>
      <div class="metric"><span class="k">Still fits after queue</span><span class="v">${fmt(100 * r.fit)}%</span></div>
    </div>
    <button class="cta" data-score="${i}">Score my project here</button>`;
  if (q) {
    const [n, mwq, exp, p10, , p90, anyWd, expWdN, county] = q;
    html += `<div class="sec"><div class="eyebrow-row"><span class="eyebrow">Queue ahead and dropout risk</span><button class="info" data-info="queueahead" data-c="${county}" aria-label="About the queue simulation">i</button></div><dl class="kv">
      <dt>Active requests at this substation</dt><dd>${fmt(n)} · ${fmt(mwq)} MW</dd>
      <dt>Expected MW built (P10–P90 range)</dt><dd>${fmt(exp)} MW (${fmt(p10)}–${fmt(p90)})</dd>
      <dt>Expected withdrawals</dt><dd>${fmt(expWdN, 1)} of ${fmt(n)} · ${fmt(100 - 100 * exp / Math.max(mwq, 1))}% of MW</dd>
      <dt>Chance at least one withdraws</dt><dd>${fmt(anyWd)}%</dd></dl></div>`;
  } else {
    html += `<p class="note">No active queue at this substation.</p>`;
  }
  if (h) {
    const [built, wd] = h, nres = built + wd, rate = (built + 10 * comp["Early study"]) / (nres + 10);
    html += `<p class="note"><b>Track record:</b> ${fmt(built)} built, ${fmt(wd)} withdrawn · ${fmt(100 * rate)}% vs ${fmt(100 * comp["Early study"])}% in ${esc(reg)}</p>`;
  }
  const ex = upgradeExposure(i, P);
  if (ex.items.length) {
    const tot = ex.items.reduce((s, x) => s + x.musd * x.share, 0);
    html += `<div class="sec"><div class="eyebrow-row"><span class="eyebrow">Lines a ${fmt(P)} MW project would overload</span><button class="info" data-info="upgrades" data-more="${ex.more ? 1 : 0}" aria-label="How upgrades are priced">i</button></div><ul class="upg">${ex.items.map((x) => `<li><button class="linkbtn" data-line="${x.j}" style="text-align:left">${esc(lineLabel(x.j))}</button><span class="num">$${fmt(x.musd, 1)}M</span>
      <small>${x.recon ? "Reconductor" : "New parallel line"} · ${fmt(D.lines.len[x.j] / 1.609, 1)} mi · ${fmt(100 * x.df)}% of your output flows here · your share ${fmt(100 * x.share)}%</small></li>`).join("")}</ul>
      <p class="note">Your share ≈ $${fmt(tot, 1)}M (≈$${fmt(tot * 1000 / P)}/kW)</p></div>`;
  } else {
    html += `<p class="note">No line overloaded at ${fmt(P)} MW.</p>`;
  }
  return html + `</div>`;
}

function costBasis(i, r, reg) {
  const R = D.risk, meta = R.meta, rn = meta.region_net_median_kw[reg] ?? meta.national_net_median_kw;
  return reg === "ERCOT"
    ? `In ERCOT, transmission utilities fund network upgrades (PUCT rule 25.195), so the estimate is the substation connection only (~$${fmt(r.poi)}/kW, MISO MTEP24 cost of a new breaker-and-a-half position at ${fmt(D.buses.kv[i])} kV).`
    : `Network upgrades $${fmt(r.net)}/kW = ${esc(reg)} median from interconnection studies since ${meta.recent_from} ($${fmt(rn)}/kW) × a factor for project size versus modelled headroom × a voltage factor × local index ${fmt(R.li[i], 2)} (from ≈${fmt(R.ln[i], 1)} nearby studies). Plus the substation connection ~$${fmt(r.poi)}/kW (MISO MTEP24).${reg === "CAISO" ? " CAISO has no LBNL cost dataset, so the national median is used." : ""}`;
}

function renderMethod() {
  const m = D.meta, s = m.summary, p = s.params, c = m.counts;
  const ic = Object.entries(s.interconnections).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${fmt(v.buses)}</td><td class="num">${fmt(v.lines)}</td><td class="num">${fmt(v.gen_gw, 0)}</td><td class="num">${fmt(v.peak_load_gw, 0)}</td><td class="num">${fmt(100 * v.share_lines_calibrated, 1)}%</td></tr>`).join("");
  const src = m.sources.map((x) => `<tr><td>${esc(x.source)}</td><td>${esc(x.retrieved)}</td><td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url.replace(/^https?:\/\//, "").slice(0, 70))}</a></td></tr>`).join("");
  $("#methodBody").innerHTML = `<div style="display:flex;justify-content:space-between;align-items:start;gap:12px"><h2 id="mTitle">How the atlas is built</h2><button class="close" style="position:static" id="mClose" aria-label="Close">×</button></div>
  <p>The atlas joins public grid data into one network model and asks a single question at every substation: how many megawatts can connect here before a transmission line reaches its limit? It is a screening tool for choosing where to look, built ${esc(m.built)} from ${fmt(c.lines)} line segments (${fmt(c.line_km)} km), ${fmt(c.buses)} buses, ${fmt(c.plants)} operating plants (${fmt(c.gen_gw)} GW) and ${fmt(c.queue_projects)} active interconnection requests (${fmt(c.queue_gw)} GW).</p>
  <p>Every number we cite here, in the README and in the market analysis is recomputed, with its source files and steps, under <button class="linkbtn" id="mClaims">Claims &amp; calculations</button>.</p>
  <h3>The model</h3>
  <ul>
    <li><b>Network.</b> HIFLD transmission lines (100–765 kV) are snapped end to end within 300 m to form buses. Bus names come from the HIFLD endpoint labels and OpenStreetMap. Lines that cross between interconnections are cut, since the Eastern, Western and ERCOT grids meet only through DC ties.</li>
    <li><b>Ratings.</b> Each line gets a typical reactance and thermal rating for its voltage class, capped by the St. Clair loadability curve for long lines.</li>
    <li><b>Load.</b> Summer-2026 peak demand for each balancing authority (EIA-930, third-highest hour) is spread over Census tracts by population and attached to the nearest bus.</li>
    <li><b>Generation.</b> ${fmt(c.gen_gw)} GW of operating units from EIA-860M (Aug 2026) are attached to the nearest bus at their reported grid voltage, then dispatched for two scenarios: summer peak, and light load (55%) with high solar and wind output. Each balancing authority first meets its own load; the remainder is traded across the interconnection.</li>
    <li><b>Power flow.</b> A DC power flow is solved for each interconnection and scenario. Where the approximated ratings cannot carry today's modeled flow, the rating is raised so that existing flows use ${fmt(100 * p.CALIB_UTIL)}% of the usable limit (share of lines adjusted is in the table below).</li>
    <li><b>Headroom.</b> For every bus, power transfer distribution factors give the MW that can be injected (generation) or withdrawn (load) before any line carrying ${fmt(100 * p.DF_MIN)}% or more of the change reaches ${fmt(100 * p.ALPHA)}% of its rating. That is the energy-only (ERIS-style) cut-off MISO and SPP use. As in ISO studies, each new megawatt is absorbed by scaling back non-nuclear generation inside the same balancing authority or ISO. The inspector also shows a stricter deliverability-style figure that counts every line above ${fmt(100 * p.DF_DELIV)}%.</li>
    <li><b>Queue ahead.</b> Active requests from the seven ISO/RTO queues (Oct 2026) and the LBNL Queued Up dataset (end of 2025, for non-ISO utilities) are matched to buses by point-of-interconnection name, or by county when the name cannot be matched. Each request is weighted by its odds of being built, estimated from what happened to 18,000 requests filed in 2000–2019, by region and stage. Nationally: ${fmt(100 * p.COMPLETION_ODDS.national["Early study"])}% before an interconnection agreement, ${fmt(100 * p.COMPLETION_ODDS.national["IA executed"])}% once one is signed, 90% under construction (claim C17). The weighted queue is added to the base case, capped at what each balancing authority can displace, and headroom is recomputed.</li>
    <li><b>Substation outlet.</b> No bus can export more than 85% of its N-1 branch capacity, less what it already exports. This stops large 500 kV hubs, where no single line carries a fifth of the injection, from reading as unlimited. Counterflow from queued projects is never credited, since those projects may withdraw.</li>
    <li><b>Substation capacity.</b> As a structural check, each bus's N-1 branch capacity is the sum of its line limits less the largest. Queue pressure is queued MW divided by that capacity, coloured red above 1.5× and green below 0.5×.</li>
  </ul>
  <div class="tbl-wrap"><table><thead><tr><th>Interconnection</th><th>Buses</th><th>Lines</th><th>Gen GW</th><th>Peak load GW</th><th>Lines re-rated</th></tr></thead><tbody>${ic}</tbody></table></div>
  <h3>Risk assessment</h3>
  <ul>
    <li><b>Cost.</b> Interconnection studies since ${D.risk.meta.recent_from} (${fmt(D.risk.meta.n_cost_studies)} projects from LBNL's cost datasets, placed on substations) give a regional median for network upgrades. It is scaled by how large the project is relative to our modelled headroom, and by voltage, using multipliers fitted on those same studies. Projects at substations we colour red were assigned about twice the network cost of projects at green ones (C20). A local index adjusts for what studies within ~80 km actually assigned. The substation connection is priced with MISO's MTEP24 cost guide. In ERCOT, network upgrades are funded by transmission utilities, so only the connection is counted.</li>
    <li><b>Time.</b> Regional median years from request to operation for projects online 2018–2025, stretched for bigger expected upgrades: projects with over $150/kW of network upgrades took about 60% longer than those under $10/kW (C21).</li>
    <li><b>Queue ahead.</b> Every active request at the substation is simulated 10,000 times with its regional, stage-specific odds of being built. Together with a model-error allowance, this gives the chance that the project still fits.</li>
    <li><b>Lines to upgrade.</b> For the chosen size, our model lists which of the five tightest lines would overload and prices a reconductor or new line with MISO unit costs, split with queued projects that also overload it.</li>
    <li><b>Grade.</b> Risk index = 100 minus a weighted score (default: cost 35%, time 30%, capacity 35%). A under 25, B 25–40, C 40–55, D 55–70, E 70+.</li>
    <li><b>Score my project.</b> The chance that one project reaches operation, from what happened to 19,761 past requests (C24), the study cost (C25), permit status (C26) and three marked assumptions (C27).</li>
  </ul>
  <h3>What it cannot see yet</h3>
  <ul>
    <li>Real line ratings, transformer and breaker-bay limits, and N-1 contingencies. These live in CEII-protected base cases (PSS/E, PSLF) that need an NDA with each ISO.</li>
    <li>Lines below 100 kV and distribution feeders. Utility hosting-capacity maps (PG&amp;E, SCE, SDG&amp;E and others) cover that level.</li>
    <li>Planned transmission upgrades, and network upgrade costs already assigned in cluster studies.</li>
    <li>Location-specific load such as data centers, which is not proportional to population.</li>
    <li>About ${fmt(100 * (m.queue_by_match["county proximity"] || 0) / c.queue_projects)}% of queue requests are placed by county rather than by POI name, so individual assignments can be wrong even when regional totals are right.</li>
  </ul>
  <h3>Sources</h3>
  <div class="tbl-wrap"><table><thead><tr><th>Dataset</th><th>Retrieved</th><th>Link</th></tr></thead><tbody>${src}</tbody></table></div>
  <p class="note">LBNL Queued Up data is CC BY 4.0 (Lawrence Berkeley National Laboratory and GridTracker). OpenStreetMap data © OpenStreetMap contributors, ODbL.</p>
  <p class="note">Code, data pipeline and this page: <a href="https://github.com/befan-music/interconnection-queue-map" target="_blank" rel="noopener">github.com/befan-music/interconnection-queue-map</a></p>`;
  $("#mClose").onclick = () => $("#method").close();
  $("#mClaims").onclick = () => { $("#method").close(); $("#claims").showModal(); };
}

// ---------------- project risk score ----------------
// Model: pipeline/project_model.py (claims C24-C26). Every input is a log-odds term, shown as a driver.
const STAGES = ["Not filed yet", "Early study", "Late study", "IA signed", "Construction"];
const TECHS = [["Solar", "Solar"], ["Wind", "Wind"], ["Storage", "Storage"], ["Solar+Storage", "Solar + storage"], ["Gas", "Gas"], ["Offshore wind", "Offshore wind"], ["Other/hybrid", "Other"]];
const SEGS = [["permits", "Permits", ["Not started", "Applied", "Approved"]],
  ["opposition", "Local opposition", ["None known", "Some concerns", "Organized / litigation"]],
  ["offtake", "Offtake", ["None", "Negotiating", "Signed"]],
  ["sib", "Same project filed elsewhere", ["0", "1–2", "3+"]]];
const SIB_LEVEL = { "0": "none", "1–2": "1-2", "3+": "3+" };
const ORD_NAME = ["none on record", "ordinance", "restrictive"];
const NOW = new Date(), NOW_Y = NOW.getFullYear(), NOW_F = NOW_Y + NOW.getMonth() / 12;
let SC = null;
const sigm = (x) => 1 / (1 + Math.exp(-x));
const binIdx = (v, bins) => { const k = bins.findIndex((b) => v <= b); return k < 0 ? bins.length : k; };
const quant = (a, q) => { const s = [...a].sort((x, y) => x - y), p = (s.length - 1) * q, lo = Math.floor(p); return s[lo] + (s[Math.min(lo + 1, s.length - 1)] - s[lo]) * (p - lo); };
const pctTxt = (p) => `${fmt(100 * p)}%`;

function scoreCalc(i, reg) {
  const S = D.score, B = D.buses, st = STAGES.indexOf(SC.stage);
  const sz = S.size_labels[binIdx(SC.mw, S.size_bins)], kv = S.kv_labels[binIdx(B.kv[i] || 0, S.kv_bins)];
  const o = S.ordinance[`${B.st[i]}|${B.cty[i]}`] || [0, 0];
  const ordCat = SC.tech === "Wind" ? o[1] : (SC.tech === "Solar" || SC.tech === "Solar+Storage") ? o[0] : null;
  const ordLvl = ["none", "ordinance", "restrictive"][ordCat || 0];
  const techName = TECHS.find((t) => t[0] === SC.tech)[1];
  const pub = (m) => [["Region", reg, m.coef.region[reg]], ["Technology", techName, m.coef.tech[SC.tech]],
    ["Size", `${fmt(SC.mw)} MW`, m.coef.size[sz]], ["POI voltage", `${fmt(B.kv[i])} kV`, m.coef.voltage[kv]],
    ["Filed elsewhere", SC.sib, m.coef.siblings[SIB_LEVEL[SC.sib]]],
    ...(ordCat == null ? [] : [["County ordinance", ORD_NAME[ordCat], m.coef.ordinance[ordLvl]]])];
  let a, terms = [];
  if (st === 4) a = Math.log(S.p_construction / (1 - S.p_construction));
  else {
    // before an agreement: application model; after: IA model; late study: midpoint in log-odds
    const w = st <= 1 ? 0 : st === 2 ? 0.5 : 1, m0 = S.m0, m1 = S.m_ia;
    a = (1 - w) * (m0.a + (m0.coef.era[S.now_era] || 0)) + w * (m1.a + (m1.coef.era[S.now_era] || 0));
    const t1 = pub(m1);
    terms = pub(m0).map((t, k) => ({ k: t[0], lv: t[1], v: (1 - w) * (t[2] || 0) + w * (t1[k][2] || 0) }));
    if (SC.cost != null && st <= 2) terms.push({ k: "Study cost", lv: `$${fmt(SC.cost)}/kW`, v: S.cost.beta[binIdx(SC.cost, S.cost.bins)] });
    terms.push({ k: "Permits", lv: SC.permits, v: S.permits[SC.permits].beta });
    terms.push({ k: "Local opposition", lv: SC.opposition, v: Math.log(S.priors.opposition[SC.opposition]), assume: true });
    terms.push({ k: "Offtake", lv: SC.offtake, v: Math.log(S.priors.offtake[SC.offtake]), assume: true });
  }
  const L = a + terms.reduce((s, t) => s + t.v, 0), P = sigm(L);
  terms.forEach((t) => { t.pp = P - sigm(L - t.v); });
  return { P, terms, st, ordCat };
}

function compsFor(i, reg) {
  const C = D.comps, rg = C.regions.indexOf(reg), t = C.techs.indexOf(SC.tech);
  const all = []; for (let k = 0; k < C.y.length; k++) if (C.t[k] === t) all.push(k);
  const near = (k) => C.mw[k] >= SC.mw / 2 && C.mw[k] <= SC.mw * 2;
  let pool = all.filter((k) => C.rg[k] === rg && near(k)), scope = `${reg} · similar size`;
  if (pool.length < 25) { pool = all.filter(near); scope = "US · similar size"; }
  if (pool.length < 25) { pool = all; scope = "US · any size"; }
  const B = D.buses, lat = B.lat[i], lon = B.lon[i], cos = Math.cos(lat * Math.PI / 180);
  const dist = (k) => C.lat[k] == null ? 400 : Math.hypot((C.lat[k] - lat) * 111, (C.lon[k] - lon) * 111 * cos);
  const sim = (k) => Math.abs(Math.log(Math.max(C.mw[k], 1) / SC.mw)) + dist(k) / 150 + Math.abs(C.y[k] - 2017) / 15;
  return { pool, scope, top: [...pool].sort((a, b) => sim(a) - sim(b)).slice(0, 6) };
}

function timeCalc(r, pool) {
  // remaining years to operation from comparable built projects, conditioned on time already in the queue
  const C = D.comps, S = D.score, st = r.st;
  const mult = SC.cost != null ? Object.values(S.cost_time_mult)[binIdx(SC.cost, S.cost_time_bins)] : 1;
  const ok = (k) => C.b[k] && C.yr[k] != null, t = C.techs.indexOf(SC.tech);
  let built = pool.filter(ok);   // too few built comparables: same technology nationally, then everything
  if (built.length < 8) { built = []; for (let k = 0; k < C.y.length; k++) if (ok(k) && C.t[k] === t) built.push(k); }
  if (built.length < 8) { built = []; for (let k = 0; k < C.y.length; k++) if (ok(k)) built.push(k); }
  const dur = built.map((k) => C.yr[k] * mult);
  let rem;
  if (st === 4) rem = [0.5, 0.75, 1, 1.25, 1.5, 2];
  else if (st === 3) {
    rem = built.filter((k) => C.iac[k] != null).map((k) => C.iac[k] * mult);
    if (rem.length < 8) { rem = []; for (let k = 0; k < C.y.length; k++) if (C.b[k] && C.iac[k] != null) rem.push(C.iac[k] * mult); }
  } else {
    const el = st === 0 ? 0 : Math.max(0, NOW_F - SC.qy - 0.5);
    rem = dur.filter((d) => d > el).map((d) => d - el);
    if (rem.length < 8) rem = dur.map((d) => Math.max(0.5, d - el));
  }
  if (!rem.length) return null;
  const left = SC.target + 1 - NOW_F;
  return { q25: quant(rem, 0.25), q50: quant(rem, 0.5), q75: quant(rem, 0.75), pBy: r.P * rem.filter((d) => d <= left).length / rem.length };
}

function renderScore() {
  const out = $("#scoreOut"), B = D.buses, R = D.risk, S = D.score, C = D.comps, i = SC.bus;
  if (i == null) {
    $("#sPoi").innerHTML = `<span class="note">Search below, or close this and click a substation.</span>`;
    out.innerHTML = `<p class="empty">Choose the substation you applied at.</p>`; return;

  const r = scoreCalc(i, reg), cp = compsFor(i, reg), t = timeCalc(r, cp.pool);
  const sIdx = R.sizes.reduce((b, s, k) => Math.abs(Math.log(s / SC.mw)) < Math.abs(Math.log(R.sizes[b] / SC.mw)) ? k : b, 0);
  const est = riskOf(i, sIdx), [q25, q75] = R.meta.residual_iqr;
  const net = SC.cost ?? est.net;
  const costR = SC.cost != null ? "your study" : reg === "ERCOT" ? "utility-funded in ERCOT" : `atlas estimate · $${fmt(est.net * q25)}–${fmt(est.net * q75)}`;
  const band = r.P >= 0.4 ? "--good" : r.P >= 0.2 ? "--warn" : "--bad";
  const yr = (q) => Math.floor(NOW_F + q);
  const drv = r.terms.filter((x) => Math.abs(x.pp) >= 0.005).sort((a, b) => Math.abs(b.pp) - Math.abs(a.pp));
  const mx = Math.max(0.05, ...drv.map((x) => Math.abs(x.pp)));
  const res = cp.pool.length, nb = cp.pool.filter((k) => C.b[k]).length;
  const yrs = cp.pool.filter((k) => C.b[k] && C.yr[k] != null).map((k) => C.yr[k]);
  const v = S.validation;
  out.innerHTML = `
    <p class="note print-only">${esc(B.name[i])} · ${esc(SC.tech)} ${fmt(SC.mw)} MW · Interconnection Headroom Atlas · ${NOW.toISOString().slice(0, 10)}</p>
    <div class="sc-top" style="--c:var(${band})"><div class="sc-p">${fmt(100 * r.P)}<small>%</small></div>
      <div><div class="lab">chance to reach operation</div><div class="exp">Typical new request in ${esc(reg)}: ${pctTxt(S.typical[reg] ?? 0.25)}</div></div></div>
    <div class="metrics">
      <div class="metric"><span class="k">Online by ${esc(SC.target)}</span><span class="v">${t ? pctTxt(t.pBy) : "–"}</span><span class="r">${t ? `if built: ${pctTxt(t.pBy / r.P)}` : ""}</span></div>
      <div class="metric"><span class="k">Expected online</span><span class="v">${t ? yr(t.q50) : "–"}</span><span class="r">${t ? `${yr(t.q25)}–${yr(t.q75)}${r.st === 4 ? " *" : ""}` : ""}</span></div>
      <div class="metric"><span class="k">Network upgrades</span><span class="v">$${fmt(net)}/kW</span><span class="r">≈$${fmt(net * SC.mw / 1000, 1)}M · ${esc(costR)}</span></div>
    </div>
    <div class="sec"><div class="eyebrow-row"><span class="eyebrow">What drives it</span><button class="info no-print" data-info="drivers" aria-label="About drivers">i</button></div><div class="drivers">${drv.length ? drv.map((x) => `<div class="drv">
      <span>${esc(x.k)} <small>${esc(x.lv)}${x.assume ? " *" : ""}</small></span>
      <span class="axis"><span style="${x.pp >= 0 ? "left" : "right"}:50%;width:${50 * Math.abs(x.pp) / mx}%;background:var(${x.pp >= 0 ? "--good" : "--bad"})"></span></span>
      <span class="num">${x.pp >= 0 ? "+" : "−"}${fmt(100 * Math.abs(x.pp))}</span></div>`).join("") : `<p class="note">Under construction: ${pctTxt(S.p_construction)} *</p>`}</div></div>
    <div class="sec"><span class="eyebrow">Comparable past projects · ${esc(cp.scope)}</span>
      <p class="note">${fmt(res)} filed 2005–2019 · <b>${pctTxt(nb / Math.max(res, 1))} built</b>${yrs.length ? ` · median ${fmt(quant(yrs, 0.5), 1)} yrs to operation` : ""}</p>
      <ul class="plist">${cp.top.map((k) => `<li><span class="n">${esc(C.name[k] || C.poi[k] || "Unnamed request")}</span><span class="num">${fmt(C.mw[k])} MW</span>
        <span class="d">${C.y[k]} · ${esc(C.st[k] || "")} · ${C.b[k] ? `<b style="color:var(--good)">Built</b>${C.yr[k] != null ? ` in ${fmt(C.yr[k], 1)} yrs` : ""}` : `<b style="color:var(--bad)">Withdrawn</b>`}</span></li>`).join("")}</ul></div>
    <dl class="kv print-only">${[["Substation", `${B.name[i]} (${B.kvl[i]} kV, ${reg})`], ["Technology · size", `${SC.tech} · ${fmt(SC.mw)} MW`],
      ["Stage · in queue since", `${SC.stage} · ${SC.qy}`], ["Target online", SC.target], ["Study cost", SC.cost != null ? `$${fmt(SC.cost)}/kW` : "unknown"],
      ...SEGS.map(([k, lab]) => [lab, SC[k]])].map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl>
    <p class="note print-only">${scoreBasis()}</p>`;
}
function scoreBasis() {
  const v = D.score.validation;
  return `Screening estimate from public data: ${fmt(v.n)} LBNL requests 2000–2019 (AUC ${fmt(v.auc_cv, 2)}), LBNL cost studies, EIA-860M permits, NREL ordinances. * = team assumption.`;
}

// ---------------- info popovers ----------------
// Explanations and definitions sit behind small "i" buttons (data-info="key") instead of on the page.
const LENS_INTRO = {
  risk: () => `<b>Risk assessment</b>: expected cost, time to operation and queue risk for a ${fmt(D.risk.sizes[sizeIdx()])} MW project. Grades combine expected cost ($/kW, from nearby interconnection studies and our grid model), time to operation (regional history) and the chance the project still fits after the queue ahead resolves.`,
  gen: () => "<b>Generation</b>: MW of new generation each substation can take after the queue ahead.",
  load: () => "<b>Large load</b>: MW a data center or other large load could draw at summer peak.",
  queue: () => "<b>Queue pressure</b>: queued MW ÷ substation capacity (N-1 branch capacity).",
  storage: () => "<b>Storage</b>: congested substations with trapped renewables, candidates for storage or reconductoring.",
};
const INFO = {
  about: () => { const m = D.meta; return `<p><b>Interconnection Headroom Atlas</b></p><p>Contiguous US · ${fmt(m.counts.buses_modeled)} modeled buses · ${fmt(m.counts.queue_gw)} GW in active queues · model built ${esc(m.built)}.</p><p>Screening estimates from public data, not utility interconnection studies. Details under Method &amp; sources.</p>`; },
  lens: () => `<p>${LENS_INTRO[lens]()}</p><ul>${lens === "risk"
    ? "<li><b>A</b> risk index under 25 (lowest)</li><li><b>B</b> 25–40</li><li><b>C</b> 40–55</li><li><b>D</b> 55–70</li><li><b>E</b> 70 or more (highest)</li>"
    : LENS[lens].legend.filter((l) => l[2]).map(([, k, d]) => `<li><b>${esc(k)}</b>: ${esc(d)}</li>`).join("")}</ul>`,
  weights: "<p>Weights are normalised to 100%. Cost scores 100 at $25/kW and 0 at $400/kW; time scores 100 at 2.5 years and 0 at 8 years; capacity is the chance the project still fits after the queue ahead resolves.</p>",
  sites: () => `<p>Named substations of at least 115 kV in the current view, ${lens === "risk" ? `lowest risk index first, for a ${fmt(D.risk.sizes[sizeIdx()])} MW project` : esc(LENS[lens].note)}.</p>`,
  disclaimer: "<p>Screening estimate from public data, not a utility interconnection study. Ratings, topology and dispatch are approximated; see Method &amp; sources.</p>",
  headroomGen: "<p>MW of new generation that can connect before a line carrying ≥20% of it reaches 85% of its rating, after the active queue ahead is added (each request weighted by its odds of being built). Worst of summer peak and light-load scenarios.</p>",
  headroomLoad: "<p>MW of new load that can be served at summer peak before a line reaches 85% of its rating, after the active queue is added (each request weighted by its odds of being built).</p>",
  outlet: "<p>The lines leaving this substation can carry this much with the largest one out of service (85% of N-1 branch capacity). Part of it is already used by existing generation and the queue.</p>",
  binding: "<p>The first line to reach 85% of its rating as MW are added here: the share of your output that flows on it, its screening limit (thermal, or St. Clair stability for long lines) and its loading today and with the queue. Click it to show it on the map.</p>",
  structural: "<p>This bus sits on a fragment of the line data that is not connected to the main network, so no power flow was run. The figure is N-1 branch capacity × 0.85, less existing and expected queued generation.</p>",
  capacity: "<p>N-1 branch capacity = sum of the line limits at this substation less the largest. Queue ÷ capacity: room below 0.5×, crowded 0.5–1.5×, oversubscribed above 1.5×.</p>",
  riskcard: (b) => {
    const i = +b.dataset.i, r = riskOf(i), reg = D.risk.regions[D.risk.rg[i]];
    return `<p><b>Risk index</b> = 100 − weighted score of cost, time and capacity fit (weights in the side panel). A under 25 … E 70 or more.</p>
      <p><b>Cost.</b> ${costBasis(i, r, reg)}</p>
      <p><b>Time.</b> Regional median years from request to operation (projects online 2018–2025), longer for bigger expected upgrades.</p>
      <p><b>Still fits.</b> Chance a ${fmt(r.P)} MW project fits once the queue ahead resolves.</p>
      <p><b>Confidence</b> drops with few nearby cost studies, in CAISO (no cost data), or when the queue here was placed mostly by county.</p>`;
  },
  queueahead: (b) => `<p>Every active request here is simulated 10,000 times with its regional, stage-specific odds of being built: expected MW built (P10–P90 range), expected withdrawals, and the chance at least one withdraws, which can trigger a restudy.</p>${+b.dataset.c >= 50 ? `<p>${fmt(+b.dataset.c)}% of these MW were placed here by county, not by name, so some may belong to a nearby substation.</p>` : ""}<p>Projects at nearby substations can also take capacity; the after-queue headroom includes them.</p>`,
  upgrades: (b) => `<p>Lines our model says this project would overload (≥20% of its output flows on them), priced with MISO MTEP24 unit costs: reconductor if the line is heat-limited, otherwise a new parallel line. Your share is split with queued projects that also overload the line.${+b.dataset.more ? " More lines are likely beyond the five tightest." : ""} An independent cross-check on the expected cost.</p>`,
  lineload: "<p>Modeled flow as a share of the usable limit (85% of the screening rating), worst of summer peak and light load. A line that limits many substations is a candidate for reconductoring or storage.</p>",
  score: () => `<p>${scoreBasis()}</p><p><button class="linkbtn" data-claim="C24">How it is built →</button></p>`,
  drivers: "<p>Percentage points each answer adds to or takes from the chance, compared with a typical request. * = team assumption, not yet backed by outcome data.</p>",
};
const pop = Object.assign(document.createElement("div"), { className: "pop", hidden: true });
pop.setAttribute("role", "note");
let popBtn = null;
function hideInfo() { if (!popBtn) return; popBtn.setAttribute("aria-expanded", "false"); popBtn = null; pop.hidden = true; }
function showInfo(b) {
  if (popBtn === b) { hideInfo(); return; }
  hideInfo();
  const f = INFO[b.dataset.info]; if (!f) return;
  (b.closest("dialog") || document.body).appendChild(pop);   // inside an open dialog, or it would be inert
  pop.innerHTML = typeof f === "function" ? f(b) : f;
  pop.hidden = false; popBtn = b; b.setAttribute("aria-expanded", "true");
  const r = b.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  const top = r.bottom + 6 + h > innerHeight - 8 ? Math.max(8, r.top - h - 6) : r.bottom + 6;
  pop.style.left = `${Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8)}px`;
  pop.style.top = `${top}px`;
}

// ---------------- wiring ----------------
function setLens(l) {
  lens = l; document.querySelectorAll(".lens button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lens === l)));
  restyle(); renderTally(); renderSites();
  if (selected?.kind === "bus") showBus(selected.i);
}

function wire() {
  document.querySelectorAll(".lens button").forEach((b) => b.onclick = () => setLens(b.dataset.lens));
  const vis = (id, on) => map.setLayoutProperty(id, "visibility", on ? "visible" : "none");
  $("#L-lines").onchange = (e) => vis("lines", e.target.checked);
  $("#L-buses").onchange = (e) => vis("buses", e.target.checked);
  $("#L-queue").onchange = (e) => vis("queue", e.target.checked);
  $("#L-plants").onchange = (e) => vis("plants", e.target.checked);
  $("#L-ba").onchange = (e) => vis("ba", e.target.checked);
  $("#L-blm").onchange = (e) => vis("blm", e.target.checked);
  $("#L-named").onchange = () => { map.setFilter("buses", minKvFilter()); renderSites(); };
  $("#minkv").onchange = () => { map.setFilter("buses", minKvFilter()); renderTally(); renderSites(); };
  $("#linecolor").onchange = restyle;
  $("#psize").onchange = updateRisk;
  for (const id of ["wCost", "wTime", "wFit"]) $(`#${id}`).oninput = () => {
    const W = weights(); $("#wCostV").textContent = `${fmt(100 * W.cost)}%`; $("#wTimeV").textContent = `${fmt(100 * W.time)}%`; $("#wFitV").textContent = `${fmt(100 * W.fit)}%`;
    updateRisk();
  };
  $("#zin").onclick = () => map.zoomIn(); $("#zout").onclick = () => map.zoomOut();
  $("#openMethod").onclick = () => $("#method").showModal();
  $("#openClaims").onclick = () => $("#claims").showModal();
  addEventListener("hashchange", openClaimFromHash);
  $("#railToggle").onclick = () => { const r = $("#rail"); const c = r.classList.toggle("collapsed"); $("#railToggle").textContent = c ? "Show" : "Hide"; $("#railToggle").setAttribute("aria-expanded", String(!c)); };
  $("#openScore").onclick = () => openScore(selected?.kind === "bus" ? selected.i : null);
  // info popovers: capture phase so an "i" inside a summary or card never triggers its parent
  document.addEventListener("click", (e) => {
    const b = e.target.closest(".info");
    if (b) { e.preventDefault(); e.stopPropagation(); showInfo(b); return; }
    if (!e.target.closest(".pop")) hideInfo();
  }, true);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && popBtn) { hideInfo(); e.preventDefault(); e.stopPropagation(); } }, true);
  document.addEventListener("scroll", hideInfo, true);
  addEventListener("resize", hideInfo);
  document.addEventListener("click", (e) => {
    const cl = e.target.closest("[data-claim]");
    if (cl) { hideInfo(); document.querySelectorAll("dialog[open]").forEach((d) => d.close()); location.hash = cl.dataset.claim; openClaimFromHash(); return; }
    const sc = e.target.closest("[data-score]"); if (sc) { openScore(+sc.dataset.score); return; }
    const s = e.target.closest("[data-bus]"); if (s) { flyToBus(+s.dataset.bus); $("#results").hidden = true; return; }
    const c = e.target.closest("[data-line]"); if (c) { highlightLine(+c.dataset.line, true); }
  });
  // search
  const B = D.buses; const named = []; for (let i = 0; i < B.n; i++) if (B.type[i] === 0 || B.osm[i]) named.push(i);
  $("#q").oninput = (e) => {
    const t = e.target.value.trim().toLowerCase(); const ul = $("#results");
    if (t.length < 2) { ul.hidden = true; return; }
    const hits = named.filter((i) => B.name[i].toLowerCase().includes(t) || (B.osm[i] || "").toLowerCase().includes(t))
      .sort((a, c) => (B.kv[c] || 0) - (B.kv[a] || 0)).slice(0, 12);
    ul.innerHTML = hits.length ? hits.map((i) => `<li><button data-bus="${i}"><span>${esc(B.name[i])}</span><small>${esc(B.kvl[i])} kV · ${esc(B.st[i] || "")}</small></button></li>`).join("") : `<li><p class="empty" style="padding:6px 8px">No substation named “${esc(t)}”.</p></li>`;
    ul.hidden = false;
  };
  // map interaction
  const tip = $("#tip");
  map.on("mousemove", (e) => {
    const f = map.queryRenderedFeatures(e.point, { layers: ["buses", "lines"].filter((l) => map.getLayoutProperty(l, "visibility") !== "none") });
    map.getCanvas().style.cursor = f.length ? "pointer" : "";
    if (!f.length) { tip.hidden = true; return; }
    const ft = f.find((x) => x.layer.id === "buses") || f[0];
    if (ft.layer.id === "buses") {
      const i = ft.properties.i; const v = lens === "load" ? B.hLq[i] : B.hGq[i]; const r = lens === "risk" ? riskOf(i) : null;
      tip.innerHTML = r ? `<b>${esc(B.name[i])}</b> · ${esc(B.kvl[i])} kV<br>Grade <b>${GRADES[r.grade]}</b> (risk ${fmt(r.risk)}) for ${fmt(r.P)} MW<br><span class="num">$${fmt(r.cost)}/kW · ${fmt(r.yrs, 1)} yrs · ${fmt(100 * r.fit)}% fit</span>`
        : `<b>${esc(B.name[i])}</b> · ${esc(B.kvl[i])} kV<br>${lens === "load" ? "Load" : "Generation"} headroom after queue: <span class="num">${mw(v)} MW</span>${B.q[i] ? `<br>Queue: <span class="num">${fmt(B.q[i])} MW</span>` : ""}`;
    } else {
      const j = ft.properties.i; const L = D.lines;
      tip.innerHTML = `<b>${esc(lineLabel(j))}</b><br>Modeled loading <span class="num">${fmt(Math.max(L.ldP[j] ?? 0, L.ldL[j] ?? 0))}%</span> of ${fmt(L.lim[j])} MW`;
    }
    tip.hidden = false; tip.style.left = `${e.point.x + 14}px`; tip.style.top = `${e.point.y + 14}px`;
  });
  map.on("mouseout", () => { tip.hidden = true; });
  map.on("click", (e) => {
    const box = [[e.point.x - 4, e.point.y - 4], [e.point.x + 4, e.point.y + 4]];
    const fb = map.queryRenderedFeatures(box, { layers: ["buses"] });
    if (fb.length) { showBus(fb[0].properties.i); return; }
    const fq = map.getLayoutProperty("queue", "visibility") === "visible" ? map.queryRenderedFeatures(box, { layers: ["queue"] }) : [];
    if (fq.length) { showBus(fq[0].properties.i); return; }
    const fl = map.queryRenderedFeatures(box, { layers: ["lines"] });
    if (fl.length) { showLine(fl[0].properties.i); return; }
  });
  map.on("moveend", renderSites);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#insp").hidden) closeInspector(); });
  const mq = matchMedia("(prefers-color-scheme: dark)"); mq.addEventListener?.("change", restyle);
  new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
}

async function main() {
  try { await load(); } catch (err) {
    $("#loadmsg").textContent = "The model data could not be loaded. If you opened this file directly, serve the map folder over HTTP (python -m http.server) and reload.";
    return;
  }
  const m = D.meta;
  computeRisk();
  $("#c-lines").textContent = fmt(m.counts.lines); $("#c-buses").textContent = fmt(m.counts.buses);
  $("#c-queue").textContent = `${fmt(m.counts.queue_located)} req.`; $("#c-plants").textContent = fmt(D.plants.id.length);
  map = new maplibregl.Map({
    container: "map", attributionControl: false, renderWorldCopies: false, dragRotate: false, pitchWithRotate: false,
    style: { version: 8, sources: {}, layers: [{ id: "bg", type: "background", paint: { "background-color": tok("--bg") } }] },
    bounds: [[-124.8, 24.4], [-66.9, 49.4]], fitBoundsOptions: { padding: { top: 30, bottom: 30, left: innerWidth > 760 ? 360 : 20, right: 20 } },
    minZoom: 2.5, maxZoom: 13,
  });
  map.touchZoomRotate.disableRotation();
  map.on("load", () => {
    addLayers(); wire(); renderTally(); renderSites(); renderMethod(); renderClaims(); openClaimFromHash();
    $("#loading").hidden = true;
  });
}
main();
})();
</script>
